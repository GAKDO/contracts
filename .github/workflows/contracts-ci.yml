# 계약 파일 검사: YAML 문법, JSON Schema 메타스키마, OpenAPI 린트. 파일이 아직 없으면 그 단계는 건너뛴다
name: 계약 검사

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: 도구 설치
        run: python -m pip install -q yamllint check-jsonschema
      - name: YAML 문법
        run: 'yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" .'
      - name: JSON Schema 메타스키마
        run: |
          files=$(git ls-files '*.schema.json')
          if [ -z "$files" ]; then echo "스키마 파일이 아직 없습니다."; exit 0; fi
          check-jsonschema --check-metaschema $files
      - name: OpenAPI 린트
        run: |
          files=$(git ls-files 'openapi/*.yaml')
          if [ -z "$files" ]; then echo "OpenAPI 파일이 아직 없습니다."; exit 0; fi
          npx -y @redocly/cli@2 lint $files
