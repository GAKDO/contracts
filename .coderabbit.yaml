# CodeRabbit AI 리뷰 설정. 레포에 CodeRabbit GitHub 앱을 설치하면 PR마다 이 파일을 읽는다.
# (블로그 .coderabbit.yaml과 같은 방식: 한국어 리뷰 + 팀 설계 규칙을 리뷰 기준으로)
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치(main) 말고도 develop으로 가는 기능 PR을 리뷰한다(CONTRIBUTING.md, Git Flow)
    base_branches:
      - "^develop$"
  path_filters:
    - "!**/package-lock.json"
  path_instructions:
    - path: "**/*"
      instructions: >-
        계약 변경이 기존 소비자(서버·화면·에이전트·부스)를 깨지 않는지(필드 삭제·이름·타입 변경), codes.yaml 값이 ERD의 CHECK 제약과 같은지 본다.
    - path: ".github/workflows/**"
      instructions: >-
        PR 제목·본문 같은 외부 입력을 run 스크립트에 직접 넣지 않는지, 권한(permissions)이 최소인지 본다.
chat:
  auto_reply: true
